[package]
name = "bitnet-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pure-Rust BitNet inference core (GGUF, ternary kernels, engine) — work in progress"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
memmap2 = { workspace = true }
half = { workspace = true }
tokenizers = { workspace = true, default-features = false }
sentencepiece = { workspace = true }
rand = { workspace = true }
libloading = "0.8"
rayon = { workspace = true }

[features]
default = []
# Optional: link-time hook for future ggml-backed matmul (see llama/ggml_bridge.rs).
experimental-ggml-kernels = []
# Documents optional OpenBLAS acceleration (`RBITNET_BLAS=1`); BLAS is loaded dynamically at runtime.
blas-llama = []

[dev-dependencies]
criterion = { workspace = true }
tempfile = "3"

[[bench]]
name = "kernels"
harness = false

[[example]]
name = "engine_smoke"
path = "examples/engine_smoke.rs"
