[package]
name = "bitnet-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pure-Rust GGUF / BitNet inference core — Engine embed API (see docs/ENGINE_API.md)"
readme = "../../docs/ENGINE_API.md"
keywords = ["gguf", "inference", "bitnet", "llm", "akasha"]
categories = ["science"]
repository.workspace = true


[dependencies]
sha2 = "=0.10.9"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
memmap2 = { workspace = true }
half = { workspace = true }
tokenizers = { workspace = true, default-features = false }
sentencepiece = { workspace = true }
rand = { workspace = true }
libloading = "0.8"
rayon = { workspace = true }

[features]
default = []
experimental-flashinfer = []
# Optional: link-time hook for future ggml-backed matmul (see llama/ggml_bridge.rs).
experimental-ggml-kernels = []
# Documents optional OpenBLAS acceleration (`RBITNET_BLAS=1`); BLAS is loaded dynamically at runtime.
blas-llama = []
# Opt-in timing spans for the real Llama forward path; absent from normal builds.
profile-llama = []

[dev-dependencies]
criterion = { workspace = true }
tempfile = "3"

[[bench]]
name = "kernels"
harness = false

[[example]]
name = "engine_smoke"
path = "examples/engine_smoke.rs"

[[example]]
name = "ternary_microbench"
path = "examples/ternary_microbench.rs"

[[example]]
name = "tq_dot_microbench"
path = "examples/tq_dot_microbench.rs"

[[example]]
name = "profile_llama"
path = "examples/profile_llama.rs"
required-features = ["profile-llama"]
