[package]
name = "rbitnet-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Multi-process OpenAI-compatible runner proxy for Rbitnet"

[lib]
name = "rbitnet_proxy"
path = "src/lib.rs"

[[bin]]
name = "rbitnet-proxy"
path = "src/main.rs"

[features]
default = []
experimental-external-backends = []

[dependencies]
axum = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["process", "net", "time"] }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http = "1"
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
