name: join-cargo-lock
on:
  push:
    paths:
      - '.cargo-lock-parts/part-*'
jobs:
  join:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Join lockfile parts
        run: |
          set -euo pipefail
          test -f .cargo-lock-parts/part-00
          cat .cargo-lock-parts/part-* > Cargo.lock
          test "$(wc -c < Cargo.lock)" -eq 93024
          rm -rf .cargo-lock-parts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git add -u .cargo-lock-parts || true
          git commit -m "chore: bump lockfile deps to clear cargo-audit" -m "Align Cargo.lock with PR #13 (b202970): crossbeam-epoch, h2, quinn-proto, rustls/webpki, memmap2, anyhow."
          git push
