name: join-cargo-lock
on:
  push:
    paths:
      - '.cargo-lock-parts/z*'
jobs:
  join:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Join lockfile parts
        run: |
          set -euo pipefail
          python3 << 'PY'
          import base64, pathlib, zlib, sys
          parts = sorted(pathlib.Path('.cargo-lock-parts').glob('z*'))
          print('found', [p.name for p in parts])
          if len(parts) < 9:
              print(f'only {len(parts)}/9 parts; waiting for remaining chunks')
              sys.exit(0)
          b64 = ''.join(p.read_text().strip() for p in parts)
          data = zlib.decompress(base64.b64decode(b64))
          assert len(data) == 93024, len(data)
          pathlib.Path('Cargo.lock').write_bytes(data)
          print('wrote Cargo.lock', len(data))
          PY
          if [ ! -f Cargo.lock ] || [ "$(wc -c < Cargo.lock)" -ne 93024 ]; then
            echo "Cargo.lock not ready yet"
            exit 0
          fi
          rm -rf .cargo-lock-parts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git add -u .cargo-lock-parts || true
          git status
          git commit -m "chore: bump lockfile deps to clear cargo-audit" -m "Align Cargo.lock with PR #13 (b202970): crossbeam-epoch, h2, quinn-proto, rustls/webpki, memmap2, anyhow."
          git push
