[workspace]
resolver = "2"
members = [
    "crates/bitnet-core",
    "crates/bitnet-server",
    "crates/rbitnet-cli",
    "crates/rbitnet-proxy",
    "crates/rbitnet-runner",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/azerothl/Rbitnet"

[patch.crates-io]
# sentencepiece-sys 0.11.3 vendored C++ does not build with GCC >= 15
# (missing #include <cstdint>); keep a patched local copy until upstream
# publishes a fixed release. Same version, one-line header fixes.
sentencepiece-sys = { path = "third_party/sentencepiece-sys" }

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace"] }
futures = "0.3"
memmap2 = "0.9"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
half = "2.4"
tokenizers = "0.21"
sentencepiece = "0.11"
rand = "0.8"
rayon = "1.10"
image = "0.25"
base64 = "0.22"
